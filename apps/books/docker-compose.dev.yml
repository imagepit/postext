# ローカル専用。資格情報は開発とテストにだけ使う。
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books-local-only
      POSTGRES_DB: books
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 2s
      timeout: 3s
      retries: 30
